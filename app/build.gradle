plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'net.murilo.scanner'
    compileSdk 35
    defaultConfig {
        applicationId 'net.murilo.scanner'
        minSdk 23
        targetSdk 34
        versionCode 40
        versionName '0.40'
        vectorDrawables { useSupportLibrary true }
    }
    // keystore fixa do projeto (se presente): builds locais e do CI saem com a MESMA assinatura,
    // senão o aparelho recusa atualizar (cada máquina gera um debug.keystore diferente).
    // No CI ela vem do secret DEBUG_KEYSTORE (ver release.yml).
    signingConfigs {
        debug {
            def ks = rootProject.file('debug.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Android Auto (Car App Library)
    implementation 'androidx.car.app:app:1.4.0'
    implementation 'androidx.car.app:app-projected:1.4.0'
    // Mapa OSM nativo (tela de visualização de radares) — sem chave, usa User-Agent próprio
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
